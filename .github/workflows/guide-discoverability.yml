name: Guide Discoverability

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 2'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/guide-discoverability.yml'
      - 'README.md'
      - 'docs/**'
      - 'scripts/generate-seo-pages.mjs'
      - 'scripts/audit-seo-pages.mjs'
      - 'scripts/verify-guide-discoverability.mjs'
      - 'scripts/verify-guide-discoverability.spec.ts'
      - 'src/index.html'
      - 'src/app/app.routes.ts'
      - 'src/app/pages/seo-content/**'
      - 'src/app/pages/auto-team-builder/auto-team-builder.page.html'
      - 'src/app/pages/saved-teams/saved-teams.page.html'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/guide-discoverability.yml'
      - 'README.md'
      - 'docs/**'
      - 'scripts/generate-seo-pages.mjs'
      - 'scripts/audit-seo-pages.mjs'
      - 'scripts/verify-guide-discoverability.mjs'
      - 'scripts/verify-guide-discoverability.spec.ts'
      - 'src/index.html'
      - 'src/app/app.routes.ts'
      - 'src/app/pages/seo-content/**'
      - 'src/app/pages/auto-team-builder/auto-team-builder.page.html'
      - 'src/app/pages/saved-teams/saved-teams.page.html'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 25 minutes"
            echo "- Concurrency policy: PR guide-discoverability runs cancel stale attempts for the same PR; scheduled and main runs are preserved."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages artifact
        env:
          APP_GA4_MEASUREMENT_ID: ${{ secrets.APP_GA4_MEASUREMENT_ID }}
          APP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.APP_GOOGLE_WEB_CLIENT_ID || '000000000000-guide-discoverability-pr.apps.googleusercontent.com' }}
          APP_GOOGLE_IOS_CLIENT_ID: ${{ secrets.APP_GOOGLE_IOS_CLIENT_ID }}
        run: npm run build:pages

      - name: Verify guide discoverability
        run: npm run discoverability:verify

      - name: Test guide discoverability verifier
        run: npm run test:discoverability

      - name: Upload discoverability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: guide-discoverability-report
          path: dist/optc-team-builder/browser/guide-discoverability-report.json
          if-no-files-found: warn
          retention-days: 14
