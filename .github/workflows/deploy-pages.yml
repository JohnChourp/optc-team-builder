name: Deploy GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 25 minutes"
            echo "- Concurrency policy: GitHub Pages deploys favor the latest production artifact and cancel stale deploy attempts."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages artifact
        env:
          APP_GA4_MEASUREMENT_ID: ${{ secrets.APP_GA4_MEASUREMENT_ID }}
          APP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.APP_GOOGLE_WEB_CLIENT_ID }}
          APP_GOOGLE_IOS_CLIENT_ID: ${{ secrets.APP_GOOGLE_IOS_CLIENT_ID }}
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/optc-team-builder/browser

      # The sitemap of the build being deployed, kept so the IndexNow job can
      # read it without running `build:pages` a second time.
      - name: Upload sitemap for IndexNow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deployed-sitemap
          path: dist/optc-team-builder/browser/sitemap.xml
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 15 minutes"
            echo "- Concurrency policy: GitHub Pages deploys favor the latest production artifact and cancel stale deploy attempts."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          error_count: 120

      - name: Dispatch public entry synthetics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run public-entry-synthetics.yml --repo "$GITHUB_REPOSITORY" --ref main -f base_url=https://optcteambuilder.com

  # 869f17h5v. The IndexNow key file has been generated into every build and
  # served at HTTP 200 since the feature was added, so the site has been
  # advertising that it participates while nothing ever submitted.
  #
  # A job on the existing deploy workflow rather than a new workflow or trigger:
  # the automatic-trigger allowlist is closed and deploy-pages is its only member.
  # `needs: deploy` because submitting before the URLs are live tells a crawler to
  # fetch the previous build.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 10 minutes"
            echo "- Concurrency policy: GitHub Pages deploys favor the latest production artifact and cancel stale deploy attempts."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download deployed sitemap
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: deployed-sitemap
          path: indexnow-sitemap

      # No `npm ci`: submit-indexnow.mjs uses only Node builtins and `fetch`.
      #
      # `continue-on-error` because the deploy has already succeeded by the time
      # this runs. IndexNow being unreachable is the search engine's outage, and
      # painting a shipped production release red for it would teach everyone to
      # ignore the colour. The step still reports what happened in the summary.
      - name: Submit changed URLs to IndexNow
        id: indexnow
        continue-on-error: true
        env:
          SEO_OUTPUT_DIR: indexnow-sitemap
        run: npm run seo:indexnow

      - name: Summarize IndexNow submission
        if: always()
        run: |
          {
            echo "### IndexNow"
            echo "- Outcome: ${{ steps.indexnow.outcome }}"
            echo "- A failure here does not affect the deploy, which already succeeded."
          } >> "${GITHUB_STEP_SUMMARY}"

  cache-freshness:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 25 minutes"
            echo "- Concurrency policy: GitHub Pages deploys favor the latest production artifact and cancel stale deploy attempts."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify PWA cache freshness
        env:
          APP_GA4_MEASUREMENT_ID: ${{ secrets.APP_GA4_MEASUREMENT_ID }}
          APP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.APP_GOOGLE_WEB_CLIENT_ID }}
          APP_GOOGLE_IOS_CLIENT_ID: ${{ secrets.APP_GOOGLE_IOS_CLIENT_ID }}
          PWA_SHELL_BUILD_SCRIPT: build:pages
          PWA_SHELL_TASK_ID: pages-cache-freshness
          PWA_SHELL_ARTIFACT_DIR: test-results/pwa-cache-freshness
        run: npm run test:pwa-shell

      - name: Upload PWA cache freshness artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pwa-cache-freshness-report
          path: test-results/pwa-cache-freshness/
          if-no-files-found: warn
          retention-days: 14
