name: Guide Discoverability

# Scheduled and manual only by policy: this build-and-verify pass is not
# allowed to run on pull requests or main pushes. Run it locally with
# `npm run build:pages && npm run discoverability:verify`.
# See docs/ci-trigger-policy.md and `npm run actions:ci-triggers`.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 2'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 25 minutes"
            echo "- Concurrency policy: scheduled and manual guide-discoverability runs are isolated per run and are never cancelled."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages artifact
        env:
          APP_GA4_MEASUREMENT_ID: ${{ secrets.APP_GA4_MEASUREMENT_ID }}
          APP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.APP_GOOGLE_WEB_CLIENT_ID || '000000000000-guide-discoverability-pr.apps.googleusercontent.com' }}
          APP_GOOGLE_IOS_CLIENT_ID: ${{ secrets.APP_GOOGLE_IOS_CLIENT_ID }}
        run: npm run build:pages

      - name: Verify guide discoverability
        run: npm run discoverability:verify

      - name: Test guide discoverability verifier
        run: npm run test:discoverability

      - name: Upload discoverability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: guide-discoverability-report
          path: dist/optc-team-builder/browser/guide-discoverability-report.json
          if-no-files-found: warn
          retention-days: 14
