name: Docs Integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 25 minutes"
            echo "- Concurrency policy: PR Docs Integrity runs cancel stale attempts for the same PR; main runs are preserved."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Note app-only validation for untrusted PR
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
        run: |
          echo "::notice::Running app-only Docs Integrity because this pull_request context cannot receive RELEASE_PUSH_TOKEN for the private optc-team-builder-brain repo. Full app+brain docs integrity still runs for trusted PRs and main pushes."

      - name: Checkout app
        uses: actions/checkout@v7
        with:
          path: optc-team-builder
          fetch-depth: 0

      - name: Checkout sibling brain
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        shell: bash
        env:
          SIBLING_CHECKOUT_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          ref="refs/heads/${branch}"
          repo="https://github.com/JohnChourp/optc-team-builder-brain.git"
          if [[ -z "${SIBLING_CHECKOUT_TOKEN:-}" ]]; then
            echo "::error::SIBLING_CHECKOUT_TOKEN is empty. Configure RELEASE_PUSH_TOKEN with read access to the private optc-team-builder-brain repo."
            exit 1
          fi

          basic_token="$(printf 'x-access-token:%s' "$SIBLING_CHECKOUT_TOKEN" | base64 -w 0)"
          auth_header="AUTHORIZATION: basic ${basic_token}"

          if ! git -c "http.https://github.com/.extraheader=${auth_header}" ls-remote "$repo" "refs/heads/main" >/dev/null 2>&1; then
            echo "::error::Unable to read private sibling repo JohnChourp/optc-team-builder-brain. Check RELEASE_PUSH_TOKEN access."
            exit 1
          fi

          if git -c "http.https://github.com/.extraheader=${auth_header}" ls-remote "$repo" "$ref" | awk -v ref="$ref" '$2 == ref { found = 1 } END { exit found ? 0 : 1 }'; then
            sibling_branch="$branch"
          else
            sibling_branch="main"
          fi

          git -c "http.https://github.com/.extraheader=${auth_header}" clone --branch "$sibling_branch" "$repo" optc-team-builder-brain

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: optc-team-builder/.nvmrc
          cache: npm
          cache-dependency-path: optc-team-builder/package-lock.json

      - name: Install dependencies
        working-directory: optc-team-builder
        run: npm ci

      - name: Check full docs integrity
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        working-directory: optc-team-builder
        run: npm run docs:integrity -- --brain-root ../optc-team-builder-brain

      - name: Check full docs commands
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        working-directory: optc-team-builder
        run: npm run docs:commands -- --brain-root ../optc-team-builder-brain

      - name: Check release runbook drift
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        working-directory: optc-team-builder
        run: npm run docs:release-runbook-drift -- --brain-root ../optc-team-builder-brain

      - name: Check app and brain workflow budgets
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        working-directory: optc-team-builder
        shell: bash
        run: |
          if grep -q 'actions:workflow-budgets' ../optc-team-builder-brain/.github/workflows/docs-integrity.yml; then
            npm run actions:workflow-budgets -- --brain-root ../optc-team-builder-brain
          else
            echo "::notice::Running app-only workflow budget check because the checked-out brain ref does not define the paired budget check yet."
            npm run actions:workflow-budgets -- --app-only
          fi

      - name: Check full docs drift
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        working-directory: optc-team-builder
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${EVENT_BEFORE:-}" && ! "${EVENT_BEFORE}" =~ ^0+$ ]]; then
            base_ref="${EVENT_BEFORE}"
          else
            base_ref="origin/${GITHUB_BASE_REF:-main}"
          fi
          npm run docs:drift -- --base-ref "${base_ref}" --head-ref HEAD --brain-root ../optc-team-builder-brain

      - name: Check app-only docs integrity
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
        working-directory: optc-team-builder
        run: npm run docs:integrity -- --app-only

      - name: Check app-only docs commands
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
        working-directory: optc-team-builder
        run: npm run docs:commands -- --app-only

      - name: Check app-only docs drift
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
        working-directory: optc-team-builder
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${EVENT_BEFORE:-}" && ! "${EVENT_BEFORE}" =~ ^0+$ ]]; then
            base_ref="${EVENT_BEFORE}"
          else
            base_ref="origin/${GITHUB_BASE_REF:-main}"
          fi
          npm run docs:drift -- --base-ref "${base_ref}" --head-ref HEAD --app-only

      - name: Check app-only workflow budgets
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
        working-directory: optc-team-builder
        run: npm run actions:workflow-budgets -- --app-only

      - name: Docs integrity script tests
        working-directory: optc-team-builder
        run: npm run test:docs-integrity

      - name: Docs command script tests
        working-directory: optc-team-builder
        run: npm run test:docs-commands

      - name: Docs drift script tests
        working-directory: optc-team-builder
        run: npm run test:docs-drift
