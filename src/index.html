  <!--
    869f13285. The site served zero security headers and carried no policy at all until 2026-09-15.

    GitHub Pages cannot set response headers, so a <meta http-equiv> policy is the only mechanism
    available. Three protections are therefore genuinely unavailable on this host and are NOT
    silently missing - they cannot be expressed here at all:

      - frame-ancestors  (meta ignores it) -> no clickjacking protection
      - X-Frame-Options  (header only)
      - X-Content-Type-Options / Permissions-Policy (header only)

    'unsafe-inline' in script-src is load-bearing and not laziness: index.html carries five inline
    bootstrap scripts and Google Tag Manager injects more at runtime, so a hash or nonce list
    cannot hold. What the policy still buys is the part that matters most for a client-side app
    with no backend - an injected script cannot reach an origin that is not listed in connect-src,
    cannot set a <base>, and cannot post a form off-site.

    'wasm-unsafe-eval' is required by sql.js, which compiles the dataset engine from WASM.

    The clarity.ms and c.bing.com origins are Microsoft Clarity, injected at runtime by the Google
    Tag Manager container GTM-TBW6L4T. Clarity appears NOWHERE in this repository - it is
    configured in the GTM console - and the first version of this policy blocked it on all four
    routes. That is the standing hazard here: a tag added to the GTM container is a script origin
    this file has never heard of, and it will be blocked silently in production. Re-run
    `npm run security:csp` after ANY change to the GTM container, not only after a change to this
    file.

    Every directive below is proven against a real served build by `npm run security:csp`, which
    drives the app and fails on any violation. Do not edit this policy without rerunning it, and
    do not verify it by deploying.
  -->

    (function bootstrapGoogleAnalytics() {
      var measurementId = String(window.__appConfig?.ga4MeasurementId || "").trim().toUpperCase();

      if (!/^G-[A-Z0-9]+$/i.test(measurementId)) {
        return;
      }

      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function() { window.dataLayer.push(arguments); };
      window["ga-disable-" + measurementId] = true;

      window.gtag("consent", "default", {
        analytics_storage: "denied",
        wait_for_update: 500,
      });
      window.gtag("js", new Date());
      window.gtag("config", measurementId, {
        send_page_view: false,
      });

      if (!document.getElementById("app-google-analytics")) {
        var script = document.createElement("script");
        script.id = "app-google-analytics";
        script.async = true;
        script.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(measurementId);
        document.head.appendChild(script);
      }

      window.__googleAnalyticsBootstrap = {
        initialized: true,
        measurementId: measurementId,
      };
    })();
  </script>
  <script>
    (function restoreGithubPagesRoute() {
      var searchParams = new URLSearchParams(window.location.search);
      var routePath = searchParams.get("__gh_path__");

      if (!routePath) {
        return;
      }

      var routeSearch = searchParams.get("__gh_search__");
      var routeHash = searchParams.get("__gh_hash__");
      var baseHref = document.querySelector("base")?.getAttribute("href") || "/";
      var normalizedBaseHref = baseHref.endsWith("/") ? baseHref : baseHref + "/";
      var normalizedRoutePath = routePath.replace(/^\/+/, "");
      var restoredUrl = normalizedRoutePath
        ? normalizedBaseHref + normalizedRoutePath
        : normalizedBaseHref;

      if (routeSearch) {
        restoredUrl += "?" + routeSearch;
      }

      if (routeHash) {
        restoredUrl += "#" + routeHash;
      }

      window.history.replaceState(null, "", restoredUrl);
    })();
  </script>
