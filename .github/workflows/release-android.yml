name: Release Android
run-name: ${{ inputs.dispatch_idempotency_key != '' && format('Release Android {0}', inputs.dispatch_idempotency_key) || 'Release Android' }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump to apply when version is empty
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Optional explicit release version in X.Y.Z format
        required: false
        type: string
      code:
        description: Optional explicit versionCode / build number
        required: false
        type: string
      trigger_run_id:
        description: Optional Check OPTC DB Release run ID that dispatched this Android release
        required: false
        type: string
      trigger_run_url:
        description: Optional Check OPTC DB Release run URL that dispatched this Android release
        required: false
        type: string
      trigger_sha:
        description: Optional source SHA from the Check OPTC DB Release run
        required: false
        type: string
      dispatch_idempotency_key:
        description: Optional duplicate-dispatch guard key from the Check OPTC DB Release run
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release-sha: ${{ steps.android-release.outputs.release-sha }}
      release-tag: ${{ steps.android-release.outputs.release-tag }}
      release-version: ${{ steps.android-release.outputs.release-version }}
      version-code: ${{ steps.android-release.outputs.version-code }}
      apk-path: ${{ steps.android-release.outputs.apk-path }}
    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 60 minutes"
            echo "- Concurrency policy: Android releases are serialized and never cancel in-progress release, tag, or asset publishing work."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install dependencies
        run: npm ci

      - name: Validate required release secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          missing=0
          required_vars=(
            ANDROID_KEYSTORE_B64
            ANDROID_SIGNING_STORE_PASSWORD
            ANDROID_SIGNING_KEY_ALIAS
            ANDROID_SIGNING_KEY_PASSWORD
          )

          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name:-}" ]]; then
              echo "::error::Missing required secret ${var_name}."
              missing=1
            fi
          done

          if (( missing == 1 )); then
            exit 1
          fi

      - name: Select GitHub auth token
        env:
          DEFAULT_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [[ -n "${RELEASE_PUSH_TOKEN}" ]]; then
            echo "RELEASE_AUTH_TOKEN=${RELEASE_PUSH_TOKEN}" >> "${GITHUB_ENV}"
          else
            echo "RELEASE_AUTH_TOKEN=${DEFAULT_GITHUB_TOKEN}" >> "${GITHUB_ENV}"
          fi

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          signing_dir="${RUNNER_TEMP}/optc-team-builder-signing"
          keystore_path="${signing_dir}/release-upload-key.jks"

          mkdir -p "${signing_dir}"
          printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"

          echo "ANDROID_SIGNING_STORE_FILE=${keystore_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_SIGNING_STORE_PASSWORD=${ANDROID_SIGNING_STORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "ANDROID_SIGNING_KEY_ALIAS=${ANDROID_SIGNING_KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "ANDROID_SIGNING_KEY_PASSWORD=${ANDROID_SIGNING_KEY_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${RELEASE_AUTH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Run Android release
        id: android-release
        env:
          RELEASE_BUMP_INPUT: ${{ inputs.bump }}
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          RELEASE_CODE_INPUT: ${{ inputs.code }}
          BUILD_MOBILE_COMMAND: npm run build:ionic && npx cap sync android
        run: |
          export GH_TOKEN="${RELEASE_AUTH_TOKEN}"

          release_args=(--require-gh-release)

          if [[ -n "${RELEASE_VERSION_INPUT}" ]]; then
            release_args+=(--version "${RELEASE_VERSION_INPUT}")
          else
            release_args+=(--bump "${RELEASE_BUMP_INPUT}")
          fi

          if [[ -n "${RELEASE_CODE_INPUT}" ]]; then
            release_args+=(--code "${RELEASE_CODE_INPUT}")
          fi

          ./scripts/release-and-tag.sh "${release_args[@]}"

          release_sha="$(git rev-parse HEAD)"
          release_version="$(node -p "require('./package.json').version")"
          version_code="$(node -e "const fs=require('fs'); const text=fs.readFileSync('android/app/build.gradle','utf8'); const match=text.match(/versionCode\\s+(\\d+)/); if(!match){process.exit(1)} console.log(match[1]);")"
          release_tag="v${release_version}"
          apk_path="build-artifacts/releases/${release_tag}/optc-team-builder-${release_tag}.apk"

          {
            echo "release-sha=${release_sha}"
            echo "release-tag=${release_tag}"
            echo "release-version=${release_version}"
            echo "version-code=${version_code}"
            echo "apk-path=${apk_path}"
          } >> "${GITHUB_OUTPUT}"

  release-provenance:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ always() && needs.release.result == 'success' }}
    permissions:
      actions: read
      contents: read

    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 20 minutes"
            echo "- Concurrency policy: Release provenance is preserved with the release run and never cancels in-progress evidence collection."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.release-sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download release-trigger report
        if: ${{ inputs.trigger_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ inputs.trigger_run_id }}
        run: |
          mkdir -p release-provenance-inputs
          for attempt in {1..18}; do
            if gh run download "${TRIGGER_RUN_ID}" \
              --name release-trigger-outcome \
              --dir release-provenance-inputs; then
              exit 0
            fi

            rm -rf release-provenance-inputs/*
            echo "release-trigger-outcome artifact not available yet; retry ${attempt}/18"
            sleep 10
          done

          echo "::error::Could not download release-trigger-outcome from run ${TRIGGER_RUN_ID}"
          exit 1

      - name: Read GitHub Release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.release-tag }}
        run: |
          gh release view "${RELEASE_TAG}" \
            --json tagName,name,url,createdAt,publishedAt,targetCommitish,assets,body \
            > release-provenance-inputs-github-release.json

      - name: Download GitHub Release APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.release-tag }}
        run: |
          mkdir -p release-provenance-inputs
          gh release download "${RELEASE_TAG}" \
            --pattern "optc-team-builder-${RELEASE_TAG}.apk" \
            --dir release-provenance-inputs

      - name: Write release provenance report
        env:
          RELEASE_TAG: ${{ needs.release.outputs.release-tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.release-version }}
          VERSION_CODE: ${{ needs.release.outputs.version-code }}
          RELEASE_SHA: ${{ needs.release.outputs.release-sha }}
          APK_PATH: release-provenance-inputs/optc-team-builder-${{ needs.release.outputs.release-tag }}.apk
          TRIGGER_RUN_ID: ${{ inputs.trigger_run_id }}
          TRIGGER_RUN_URL: ${{ inputs.trigger_run_url }}
          TRIGGER_SHA: ${{ inputs.trigger_sha }}
        run: |
          args=(
            --github-release release-provenance-inputs-github-release.json
            --release-tag "${RELEASE_TAG}"
            --release-version "${RELEASE_VERSION}"
            --version-code "${VERSION_CODE}"
            --release-sha "${RELEASE_SHA}"
            --apk-path "${APK_PATH}"
            --output release-provenance.json
            --summary release-provenance.md
          )

          if [[ -n "${TRIGGER_RUN_ID}" ]]; then
            args+=(--release-trigger-report release-provenance-inputs/release-trigger-outcome.json)
            args+=(--trigger-run-id "${TRIGGER_RUN_ID}")
            args+=(--trigger-run-url "${TRIGGER_RUN_URL}")
            args+=(--trigger-sha "${TRIGGER_SHA}")
          else
            args+=(--release-trigger-report none)
          fi

          npm run --silent release:provenance -- "${args[@]}"
          cat release-provenance.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release provenance artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-provenance
          path: |
            release-provenance.json
            release-provenance.md
            release-provenance-inputs-github-release.json
          if-no-files-found: error
          retention-days: 90

  deploy-pages:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: release-android-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 25 minutes"
            echo "- Concurrency policy: Release Pages deploys are serialized and never cancel in-progress release deploy evidence."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.release-sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages artifact
        env:
          APP_GA4_MEASUREMENT_ID: ${{ secrets.APP_GA4_MEASUREMENT_ID }}
          APP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.APP_GOOGLE_WEB_CLIENT_ID }}
          APP_GOOGLE_IOS_CLIENT_ID: ${{ secrets.APP_GOOGLE_IOS_CLIENT_ID }}
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/optc-team-builder/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  post-dispatch-production-smoke:
    needs:
      - release
      - release-provenance
      - deploy-pages
    if: ${{ always() && needs.release.result == 'success' && (needs.release-provenance.result == 'success' || needs.release-provenance.result == 'failure') && needs.deploy-pages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read

    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 20 minutes"
            echo "- Concurrency policy: Post-dispatch production smoke stays attached to the release run and is not canceled by later release checks."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.release-sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download release provenance artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: release-provenance
          path: post-dispatch-production-smoke/release-provenance

      - name: Run production public-entry smoke
        id: public-entry
        continue-on-error: true
        env:
          PUBLIC_ENTRY_BASE_URL: https://optcteambuilder.com
          PUBLIC_ENTRY_SYNTHETIC_ARTIFACT_DIR: ${{ github.workspace }}/post-dispatch-production-smoke/public-entry
          PUBLIC_ENTRY_SYNTHETIC_REPORT: ${{ github.workspace }}/post-dispatch-production-smoke/public-entry/public-entry-synthetics-report.json
        run: npm run synthetic:public-entry

      - name: Write post-dispatch production smoke report
        env:
          RELEASE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_TAG: ${{ needs.release.outputs.release-tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.release-version }}
          VERSION_CODE: ${{ needs.release.outputs.version-code }}
          TRIGGER_RUN_ID: ${{ inputs.trigger_run_id }}
        run: |
          args=(
            --release-provenance post-dispatch-production-smoke/release-provenance/release-provenance.json
            --public-entry-report post-dispatch-production-smoke/public-entry/public-entry-synthetics-report.json
            --release-run-url "${RELEASE_RUN_URL}"
            --release-tag "${RELEASE_TAG}"
            --release-version "${RELEASE_VERSION}"
            --version-code "${VERSION_CODE}"
            --output post-dispatch-production-smoke/post-dispatch-production-smoke.json
            --summary post-dispatch-production-smoke/post-dispatch-production-smoke.md
          )

          if [[ -n "${TRIGGER_RUN_ID}" ]]; then
            args+=(--require-auto-release-link)
          fi

          smoke_status=0
          npm run --silent release:post-dispatch-smoke -- "${args[@]}" || smoke_status=$?
          cat post-dispatch-production-smoke/post-dispatch-production-smoke.md >> "${GITHUB_STEP_SUMMARY}"
          exit "${smoke_status}"

      - name: Upload post-dispatch production smoke artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: post-dispatch-production-smoke
          path: post-dispatch-production-smoke/
          if-no-files-found: warn
          retention-days: 90
