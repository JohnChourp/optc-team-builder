name: Dataset Change Digest

# Manual-only by policy. The digest is not allowed to run on pull requests or
# main pushes; generate it locally with `npm run dataset:digest`.
# See docs/ci-trigger-policy.md and `npm run actions:ci-triggers`.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref or SHA to diff the dataset from.
        required: false
        default: HEAD~1
        type: string
      head_ref:
        description: Head ref or SHA to diff the dataset to.
        required: false
        default: HEAD
        type: string

permissions:
  contents: read

jobs:
  digest:
    name: Build digest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      markdown_path: dataset-change-digest.md
      json_path: dataset-change-digest.json

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve digest range
        id: range
        shell: bash
        env:
          INPUT_BASE_REF: ${{ inputs.base_ref || 'HEAD~1' }}
          INPUT_HEAD_REF: ${{ inputs.head_ref || 'HEAD' }}
        run: |
          set -euo pipefail

          base_ref="$(git rev-parse --verify "${INPUT_BASE_REF}^{commit}")"
          head_ref="$(git rev-parse --verify "${INPUT_HEAD_REF}^{commit}")"

          echo "base_ref=${base_ref}" >> "${GITHUB_OUTPUT}"
          echo "head_ref=${head_ref}" >> "${GITHUB_OUTPUT}"

      - name: Build dataset change digest
        run: |
          npm run dataset:digest -- \
            --base-ref "${{ steps.range.outputs.base_ref }}" \
            --head-ref "${{ steps.range.outputs.head_ref }}" \
            --output dataset-change-digest.md \
            --json-output dataset-change-digest.json

          cat dataset-change-digest.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dataset-change-digest
          path: |
            dataset-change-digest.md
            dataset-change-digest.json
          if-no-files-found: error
          retention-days: 30
