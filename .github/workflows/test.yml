name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      full_plan: ${{ steps.route.outputs.full_plan }}
      categories: ${{ steps.route.outputs.categories }}
      reasons: ${{ steps.route.outputs.reasons }}
      run_angular: ${{ steps.route.outputs.run_angular }}
      run_script_suites: ${{ steps.route.outputs.run_script_suites }}
      run_dataset_perf: ${{ steps.route.outputs.run_dataset_perf }}
      run_e2e: ${{ steps.route.outputs.run_e2e }}
      run_quarantine: ${{ steps.route.outputs.run_quarantine }}
      script_suites: ${{ steps.route.outputs.script_suites }}
      script_matrix: ${{ steps.route.outputs.script_matrix }}
      changed_files_json: ${{ steps.route.outputs.changed_files_json }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout trusted router
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-router-base

      - name: Resolve diff range
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${GITHUB_SHA}"
          fi

          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Route checks
        id: route
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${{ steps.diff.outputs.base_sha }}"
          head_sha="${{ steps.diff.outputs.head_sha }}"
          full_script_suites="ci-routing,maintainer-doctor,dataset-digest,saved-team-codecs,captain-contracts,release-check,release-readiness,docs-integrity,docs-commands,docs-drift,drive-sync-server,source-data,perf-budget,e2e-triage,pwa-shell"
          full_script_matrix='{"include":[{"suite":"ci-routing","label":"CI routing tests","command":"npm run test:ci-routing"},{"suite":"maintainer-doctor","label":"Maintainer environment doctor tests","command":"npm run test:maintainer-doctor"},{"suite":"dataset-digest","label":"Dataset change digest tests","command":"npm run test:dataset-digest"},{"suite":"saved-team-codecs","label":"Saved-team codec fuzz tests","command":"npm run test:saved-team-codecs"},{"suite":"captain-contracts","label":"Captain contract script tests","command":"npm run test:captain-contracts"},{"suite":"release-check","label":"Release detector replay tests","command":"npm run test:release-check"},{"suite":"release-readiness","label":"Release readiness report tests","command":"npm run test:release-readiness"},{"suite":"docs-integrity","label":"Docs integrity script tests","command":"npm run test:docs-integrity"},{"suite":"docs-commands","label":"Docs command script tests","command":"npm run test:docs-commands"},{"suite":"docs-drift","label":"Docs drift script tests","command":"npm run test:docs-drift"},{"suite":"drive-sync-server","label":"Drive sync backend tests","command":"npm run test:drive-sync-server"},{"suite":"source-data","label":"Source data validation tests","command":"npx vitest run scripts/lib/dataset-integrity.spec.ts scripts/lib/manual-character-overlay.spec.ts scripts/lib/manual-character-apply.spec.ts scripts/lib/manual-character-prune.spec.ts scripts/lib/party-conflict-keys.spec.ts scripts/upsert-manual-character.spec.ts"},{"suite":"perf-budget","label":"Performance budget script tests","command":"npm run test:perf-budget"},{"suite":"e2e-triage","label":"Playwright routing and quarantine tests","command":"npm run test:e2e-triage"},{"suite":"pwa-shell","label":"PWA shell safety tests","command":"npm run test:pwa-shell"}]}'

          write_full_plan() {
            local reason="$1"
            local changed_files_json="$2"
            {
              echo "full_plan=true"
              echo "categories=full-risk"
              echo "reasons=${reason}"
              echo "run_angular=true"
              echo "run_script_suites=true"
              echo "run_dataset_perf=true"
              echo "run_e2e=true"
              echo "run_quarantine=true"
              echo "script_suites=${full_script_suites}"
              echo "script_matrix=${full_script_matrix}"
              echo "changed_files_json=${changed_files_json}"
            } >> "${GITHUB_OUTPUT}"

            {
              echo "# CI check routing"
              echo
              echo "Full plan: yes"
              echo "Categories: full-risk"
              echo "Reasons: ${reason}"
              echo
              echo "| Check group | Runs |"
              echo "| --- | --- |"
              echo "| Angular unit tests | yes |"
              echo "| Script suites | ${full_script_suites} |"
              echo "| Dataset performance guard | yes |"
              echo "| Blocking browser e2e | yes |"
              echo "| Quarantine browser e2e | yes |"
              echo
              echo "## Changed files"
              echo
              node --input-type=module -e 'const files = JSON.parse(process.argv[1]); if (files.length === 0) { console.log("- none detected"); } else { for (const file of files) console.log("- `" + file.replace(/`/g, "\\`") + "`"); }' "${changed_files_json}"
            } > ci-check-routing-summary.md
          }

          if ! name_status="$(git diff --name-status --diff-filter=ACMRTD "${base_sha}...${head_sha}" 2>&1)"; then
            reason="$(printf '%s' "git diff unavailable: ${name_status}" | tr '\r\n' ' ' | sed 's/[[:space:]][[:space:]]*/ /g')"
            write_full_plan "${reason}" "[]"
            exit 0
          fi

          changed_files_json="$(
            NAME_STATUS="${name_status}" node --input-type=module -e 'const files = []; for (const line of (process.env.NAME_STATUS || "").split(/\r?\n/u)) { if (!line.trim()) continue; const [status, ...paths] = line.split("\t"); if (/^[CR]/u.test(status) && paths.length >= 2) { files.push(paths[0], paths[1]); } else if (paths.length >= 1) { files.push(paths[0]); } } console.log(JSON.stringify([...new Set(files)].sort()));'
          )"

          critical_change="$(
            node --input-type=module -e "const files = JSON.parse(process.argv[1]); const critical = files.some((file) => file === 'package.json' || file === 'package-lock.json' || file.startsWith('.github/workflows/') || file === 'scripts/ci-check-routing.mjs' || file === 'scripts/ci-check-routing.spec.ts'); console.log(critical ? 'true' : 'false');" "${changed_files_json}"
          )"

          if [[ "${critical_change}" == "true" ]]; then
            write_full_plan "dependency, workflow, or routing changes fail closed before running PR-modified router code" "${changed_files_json}"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            router_script=".ci-router-base/scripts/ci-check-routing.mjs"
          else
            router_script="./scripts/ci-check-routing.mjs"
          fi

          if [[ ! -f "${router_script}" ]]; then
            write_full_plan "trusted routing script is unavailable on the base ref" "${changed_files_json}"
            exit 0
          fi

          node "${router_script}" \
            --base "${base_sha}" \
            --head "${head_sha}" \
            --format github-output

      - name: Summarize routing
        run: |
          if [[ ! -f ci-check-routing-summary.md ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -f .ci-router-base/scripts/ci-check-routing.mjs ]]; then
              router_script=".ci-router-base/scripts/ci-check-routing.mjs"
            else
              router_script="./scripts/ci-check-routing.mjs"
            fi

            node "${router_script}" \
              --base "${{ steps.diff.outputs.base_sha }}" \
              --head "${{ steps.diff.outputs.head_sha }}" \
              --format markdown > ci-check-routing-summary.md
          fi

          cat ci-check-routing-summary.md
          cat ci-check-routing-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload routing summary
        uses: actions/upload-artifact@v7
        with:
          name: ci-check-routing-summary
          path: ci-check-routing-summary.md
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Note skipped Angular tests
        if: needs.changes.outputs.run_angular != 'true'
        run: |
          echo "Angular unit tests skipped by targeted CI routing."
          echo "Categories: ${{ needs.changes.outputs.categories }}"

      - name: Checkout
        if: needs.changes.outputs.run_angular == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: needs.changes.outputs.run_angular == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.run_angular == 'true'
        run: npm ci

      - name: Angular unit tests
        if: needs.changes.outputs.run_angular == 'true'
        run: npm run test:ci

  script-suites:
    name: Script suite (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_script_suites == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.script_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        if: matrix.suite == 'pwa-shell'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (chromium)
        if: matrix.suite == 'pwa-shell'
        run: npx playwright install --with-deps chromium

      - name: ${{ matrix.label }}
        run: ${{ matrix.command }}

      - name: Upload PWA shell artifacts
        if: always() && matrix.suite == 'pwa-shell'
        uses: actions/upload-artifact@v7
        with:
          name: pwa-shell-report
          path: test-results/pwa-shell/
          retention-days: 14

  dataset-performance:
    name: Dataset performance guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_dataset_perf == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dataset performance guard
        run: npm run perf:dataset -- --assert

  e2e:
    name: Cross-browser e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright (${{ matrix.browser }})
        run: node ./scripts/run-playwright-e2e.mjs --e2e-project=${{ matrix.browser }} --quarantine-mode=exclude
        env:
          CI: 'true'

      - name: Summarize Playwright failures (${{ matrix.browser }})
        if: always()
        run: |
          node ./scripts/summarize-playwright-failures.mjs \
            --input test-results \
            --output-json test-results/playwright-failure-summary-${{ matrix.browser }}.json \
            --output-md test-results/playwright-failure-summary-${{ matrix.browser }}.md \
            --append-github-step-summary

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-quarantine:
    name: Quarantined browser e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_quarantine == 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run quarantined Playwright (${{ matrix.browser }})
        run: node ./scripts/run-playwright-e2e.mjs --e2e-project=${{ matrix.browser }} --quarantine-mode=only
        env:
          CI: 'true'

      - name: Summarize quarantined Playwright failures (${{ matrix.browser }})
        if: always()
        run: |
          node ./scripts/summarize-playwright-failures.mjs \
            --input test-results \
            --output-json test-results/playwright-quarantine-failure-summary-${{ matrix.browser }}.json \
            --output-md test-results/playwright-quarantine-failure-summary-${{ matrix.browser }}.md \
            --append-github-step-summary

      - name: Upload quarantined Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-quarantine-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
