name: Dataset Change Digest

on:
  pull_request:
    paths:
      - '.github/workflows/dataset-change-digest.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'public/assets/data/**'
      - 'scripts/dataset-change-digest.mjs'
      - 'scripts/dataset-change-digest.spec.ts'
      - 'scripts/import-optc-data.mjs'
      - 'scripts/auto-team-builder-ability-parser.mjs'
      - 'scripts/data/**'
      - 'scripts/lib/**'
      - 'src/app/core/services/fixtures/captain-contract-cases.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dataset-change-digest.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'public/assets/data/**'
      - 'scripts/dataset-change-digest.mjs'
      - 'scripts/dataset-change-digest.spec.ts'
      - 'scripts/import-optc-data.mjs'
      - 'scripts/auto-team-builder-ability-parser.mjs'
      - 'scripts/data/**'
      - 'scripts/lib/**'
      - 'src/app/core/services/fixtures/captain-contract-cases.json'

permissions:
  contents: read

jobs:
  digest:
    name: Build digest
    runs-on: ubuntu-latest
    outputs:
      markdown_path: dataset-change-digest.md
      json_path: dataset-change-digest.json

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve digest range
        id: range
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
          else
            base_ref="${{ github.event.before }}"
            head_ref="${GITHUB_SHA}"
          fi

          echo "base_ref=${base_ref}" >> "${GITHUB_OUTPUT}"
          echo "head_ref=${head_ref}" >> "${GITHUB_OUTPUT}"

      - name: Build dataset change digest
        run: |
          npm run dataset:digest -- \
            --base-ref "${{ steps.range.outputs.base_ref }}" \
            --head-ref "${{ steps.range.outputs.head_ref }}" \
            --output dataset-change-digest.md \
            --json-output dataset-change-digest.json

          cat dataset-change-digest.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: dataset-change-digest
          path: |
            dataset-change-digest.md
            dataset-change-digest.json
          if-no-files-found: error
          retention-days: 30

  pr-comment:
    name: Update PR comment
    runs-on: ubuntu-latest
    needs: digest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Download digest artifact
        uses: actions/download-artifact@v7
        with:
          name: dataset-change-digest
          path: dataset-change-digest

      - name: Upsert digest comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          marker="<!-- optc-dataset-change-digest -->"
          body_file="$(mktemp)"
          {
            echo "${marker}"
            echo
            cat dataset-change-digest/dataset-change-digest.md
            echo
            echo "Artifact and full run: ${RUN_URL}"
          } > "${body_file}"

          comment_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- optc-dataset-change-digest -->"))) | .id' \
              | tail -n 1
          )"

          if [[ -n "${comment_id}" ]]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --field "body=@${body_file}" >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --field "body=@${body_file}" >/dev/null
          fi
