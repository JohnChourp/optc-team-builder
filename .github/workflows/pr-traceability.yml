name: PR Traceability

# Manual-only by policy: no workflow in this repo runs because of a pull
# request. Run the same gate locally with `npm run pr:traceability -- --pr <n>`.
# See docs/ci-trigger-policy.md and `npm run actions:ci-triggers`.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to check.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-traceability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check PR traceability
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-pr-traceability.mjs --pr "${{ inputs.pr_number }}"
