name: Check OPTC DB Release

on:
  workflow_dispatch:
    inputs:
      release_dispatch_mode:
        description: 'Use verify-only for safe report generation, or dispatch-if-needed to run Release Android when new IDs exist.'
        required: true
        type: choice
        default: verify-only
        options:
          - verify-only
          - dispatch-if-needed
  schedule:
    - cron: '37 7 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: optc-db-release-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run_status: ${{ steps.release-trigger-report.outputs.run_status }}
      run_reason: ${{ steps.release-trigger-report.outputs.run_reason }}
      release_needed: ${{ steps.release-trigger-report.outputs.release_needed }}
      new_character_count: ${{ steps.release-trigger-report.outputs.new_character_count }}
      release_dispatched: ${{ steps.release-trigger-report.outputs.release_dispatched }}
      release_dispatch_mode: ${{ steps.release-trigger-report.outputs.release_dispatch_mode }}
      release_dispatch_blocked: ${{ steps.release-trigger-report.outputs.release_dispatch_blocked }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read release trigger policy
        id: release-policy
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          import { buildReleasePolicyGitHubOutputs } from './scripts/lib/release-trigger-policy.mjs';

          const outputs = buildReleasePolicyGitHubOutputs();

          for (const [key, value] of Object.entries(outputs)) {
            appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE

      - name: Resolve release dispatch mode
        id: release-dispatch-mode
        env:
          REQUESTED_RELEASE_DISPATCH_MODE: ${{ github.event.inputs.release_dispatch_mode }}
          VERIFY_ONLY_MODE: ${{ steps.release-policy.outputs.release_dispatch_mode_verify_only }}
          DISPATCH_IF_NEEDED_MODE: ${{ steps.release-policy.outputs.release_dispatch_mode_dispatch_if_needed }}
          SCHEDULED_MODE: ${{ steps.release-policy.outputs.release_scheduled_dispatch_mode }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_dispatch_mode="${REQUESTED_RELEASE_DISPATCH_MODE:-${VERIFY_ONLY_MODE}}"
          else
            release_dispatch_mode="${SCHEDULED_MODE:-${DISPATCH_IF_NEEDED_MODE}}"
          fi

          case "${release_dispatch_mode}" in
            "${VERIFY_ONLY_MODE}"|"${DISPATCH_IF_NEEDED_MODE}")
              echo "release_dispatch_mode=${release_dispatch_mode}" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Invalid release dispatch mode: ${release_dispatch_mode}" >&2
              exit 1
              ;;
          esac

      - name: Validate release detector fixtures
        id: fixture-validation
        run: |
          npm run test:release-check
          npm run --silent data:backtest-release -- --json

          valid_fixtures=(
            no-change
            new-character
            active-release-running
            upstream-shape-drift
          )

          for fixture in "${valid_fixtures[@]}"; do
            echo "::group::Release detector fixture: ${fixture}"
            npm run --silent data:check-release -- --fixture="${fixture}" --json || {
              exit_code=$?
              echo "::endgroup::"
              exit "${exit_code}"
            }
            echo "::endgroup::"
          done

          echo "::group::Release detector fixture: error (expected failure)"
          if npm run --silent data:check-release -- --fixture=error --json; then
            echo "::endgroup::"
            echo "Expected the release detector error fixture to fail." >&2
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Release detector fixture: source-contract-broken (expected failure)"
          if npm run --silent data:check-release -- --fixture=source-contract-broken --json; then
            echo "::endgroup::"
            echo "Expected the release detector source-contract-broken fixture to fail." >&2
            exit 1
          fi
          echo "::endgroup::"

      - name: Check upstream OPTC DB character IDs
        id: release-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run --silent data:check-release -- --json > release-check.json

          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('release-check.json', 'utf8'));
          const outputs = [
            `release_needed=${result.releaseNeeded ? 'true' : 'false'}`,
            `new_character_count=${result.newCharacterCount}`,
          ];

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${outputs.join('\n')}\n`);
          NODE

      - name: Download recent upstream monitor history
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p upstream-monitor-artifacts/history
          if ! run_ids="$(
            gh run list \
              --workflow check-optc-db-release.yml \
              --branch main \
              --status completed \
              --limit 45 \
              --json databaseId \
              --jq '.[].databaseId'
          )"; then
            echo "Could not list previous Check OPTC DB Release runs; upstream monitor will run without downloaded history." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [[ -z "${run_ids}" ]]; then
            echo "No previous completed Check OPTC DB Release runs found for upstream monitor history." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          for run_id in ${run_ids}; do
            run_dir="upstream-monitor-artifacts/history/run-${run_id}"
            mkdir -p "${run_dir}"

            if gh run download "${run_id}" --name upstream-monitor-report --dir "${run_dir}"; then
              echo "Downloaded upstream monitor history from run ${run_id}." >> "${GITHUB_STEP_SUMMARY}"
            else
              rm -rf "${run_dir}"
              echo "No upstream monitor artifact found for run ${run_id}." >> "${GITHUB_STEP_SUMMARY}"
            fi
          done

      - name: Check active Android release runs
        id: active-release
        if: steps.release-check.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WORKFLOW: ${{ steps.release-policy.outputs.release_workflow }}
          ACTIVE_STATUSES_JSON: ${{ steps.release-policy.outputs.active_statuses_json }}
        run: |
          active_count="$(
            gh run list \
              --workflow "${RELEASE_WORKFLOW}" \
              --limit 20 \
              --json status \
              --jq "${ACTIVE_STATUSES_JSON} as \$activeStatuses | [.[] | select(.status as \$status | \$activeStatuses | index(\$status))] | length"
          )"
          echo "active_count=${active_count}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch Android release
        id: dispatch-release
        if: steps.release-check.outputs.release_needed == 'true' && steps.active-release.outputs.active_count == '0' && steps.release-dispatch-mode.outputs.release_dispatch_mode == 'dispatch-if-needed'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WORKFLOW: ${{ steps.release-policy.outputs.release_workflow }}
          RELEASE_REF: ${{ steps.release-policy.outputs.release_ref }}
          RELEASE_BUMP: ${{ steps.release-policy.outputs.release_bump }}
        run: |
          gh workflow run "${RELEASE_WORKFLOW}" \
            --ref "${RELEASE_REF}" \
            -f "bump=${RELEASE_BUMP}" \
            -f "trigger_run_id=${GITHUB_RUN_ID}" \
            -f "trigger_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f "trigger_sha=${GITHUB_SHA}"

      - name: Block release dispatch for verification-only mode
        id: verify-only-dispatch
        if: steps.release-check.outputs.release_needed == 'true' && steps.active-release.outputs.active_count == '0' && steps.release-dispatch-mode.outputs.release_dispatch_mode == 'verify-only'
        run: |
          echo "Release dispatch blocked because this manual run is verification-only."

      - name: Skip release dispatch
        id: skip-release
        if: steps.release-check.outputs.release_needed != 'true'
        run: |
          echo "Release dispatch skipped because no new upstream character IDs were detected."

      - name: Write release trigger report
        id: release-trigger-report
        if: ${{ always() }}
        env:
          RELEASE_CHECK_RESULT_PATH: release-check.json
          FIXTURE_VALIDATION_OUTCOME: ${{ steps.fixture-validation.outcome }}
          RELEASE_CHECK_OUTCOME: ${{ steps.release-check.outcome }}
          ACTIVE_RELEASE_OUTCOME: ${{ steps.active-release.outcome }}
          DISPATCH_RELEASE_OUTCOME: ${{ steps.dispatch-release.outcome }}
          VERIFY_ONLY_DISPATCH_OUTCOME: ${{ steps.verify-only-dispatch.outcome }}
          SKIP_RELEASE_OUTCOME: ${{ steps.skip-release.outcome }}
          ACTIVE_RELEASE_COUNT: ${{ steps.active-release.outputs.active_count }}
          RELEASE_DISPATCH_WORKFLOW: ${{ steps.release-policy.outputs.release_workflow }}
          RELEASE_DISPATCH_REF: ${{ steps.release-policy.outputs.release_ref }}
          RELEASE_DISPATCH_BUMP: ${{ steps.release-policy.outputs.release_bump }}
          RELEASE_DISPATCH_MODE: ${{ steps.release-dispatch-mode.outputs.release_dispatch_mode }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync, writeFileSync } from 'node:fs';

          import {
            buildReleaseTriggerReportFromEnv,
            formatReleaseTriggerSummary,
          } from './scripts/check-optc-release-needed.mjs';

          let releaseCheckResult = null;
          const resultPath = process.env.RELEASE_CHECK_RESULT_PATH;

          if (resultPath && existsSync(resultPath)) {
            try {
              releaseCheckResult = JSON.parse(readFileSync(resultPath, 'utf8'));
            } catch (error) {
              console.warn(`Could not parse ${resultPath}: ${error.message}`);
            }
          }

          const report = buildReleaseTriggerReportFromEnv({ releaseCheckResult });
          writeFileSync('release-trigger-outcome.json', `${JSON.stringify(report, null, 2)}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, formatReleaseTriggerSummary(report));

          const outputs = [
            `run_status=${report.status}`,
            `run_reason=${report.reason}`,
            `release_needed=${report.dispatch.releaseNeeded ? 'true' : 'false'}`,
            `new_character_count=${report.comparison?.newCharacterCount ?? 0}`,
            `release_dispatched=${report.dispatch.releaseDispatched ? 'true' : 'false'}`,
            `release_dispatch_mode=${report.dispatch.mode}`,
            `release_dispatch_blocked=${report.dispatch.blocked ? 'true' : 'false'}`,
          ];

          appendFileSync(process.env.GITHUB_OUTPUT, `${outputs.join('\n')}\n`);
          NODE

      - name: Upload release trigger report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-trigger-outcome
          path: release-trigger-outcome.json
          if-no-files-found: error

      - name: Write upstream monitor report
        id: upstream-monitor
        if: ${{ always() }}
        run: |
          mkdir -p upstream-monitor-artifacts/current

          npm run --silent data:monitor-upstream -- \
            --release-check release-check.json \
            --history-dir upstream-monitor-artifacts/history \
            --output upstream-monitor-artifacts/current/upstream-monitor-report.json \
            --summary upstream-monitor-artifacts/current/upstream-monitor-summary.md

          cat upstream-monitor-artifacts/current/upstream-monitor-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Write release detector status artifact
        id: release-detector-status
        if: ${{ always() }}
        run: |
          mkdir -p release-detector-status

          npm run --silent release:detector-status -- \
            --release-trigger-report release-trigger-outcome.json \
            --upstream-monitor-report upstream-monitor-artifacts/current/upstream-monitor-report.json \
            --output release-detector-status/release-detector-status.json \
            --summary release-detector-status/release-detector-status.md

          cat release-detector-status/release-detector-status.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release detector status artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-detector-status
          path: |
            release-detector-status/release-detector-status.json
            release-detector-status/release-detector-status.md
          if-no-files-found: error
          retention-days: 90

      - name: Upload upstream monitor report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: upstream-monitor-report
          path: |
            upstream-monitor-artifacts/current/upstream-monitor-report.json
            upstream-monitor-artifacts/current/upstream-monitor-summary.md
          if-no-files-found: error
          retention-days: 90

  notify:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ always() }}
    permissions:
      contents: read
      actions: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download release trigger report artifact
        uses: actions/download-artifact@v8
        with:
          name: release-trigger-outcome
          path: .

      - name: Notify maintainers about release trigger outcome
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/notify-release-trigger-outcome.mjs --report=release-trigger-outcome.json

      - name: Download upstream monitor report artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: upstream-monitor-report
          path: .

      - name: Notify maintainers about upstream freshness and drift
        if: ${{ hashFiles('upstream-monitor-report.json') != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/notify-upstream-monitor.mjs --report=upstream-monitor-report.json
