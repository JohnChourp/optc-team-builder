name: Docs Integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v7
        with:
          path: optc-team-builder

      - name: Checkout sibling brain
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          repo="https://github.com/JohnChourp/optc-team-builder-brain.git"
          if git ls-remote --exit-code --heads "$repo" "$branch" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$branch" "$repo" optc-team-builder-brain
          else
            git clone --depth 1 --branch main "$repo" optc-team-builder-brain
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: optc-team-builder/.nvmrc
          cache: npm
          cache-dependency-path: optc-team-builder/package-lock.json

      - name: Install dependencies
        working-directory: optc-team-builder
        run: npm ci

      - name: Check docs integrity
        working-directory: optc-team-builder
        run: npm run docs:integrity -- --brain-root ../optc-team-builder-brain

      - name: Docs integrity script tests
        working-directory: optc-team-builder
        run: npm run test:docs-integrity
