name: CodeQL

# Scheduled and manual only by policy: CodeQL is not allowed to run on every
# pull request or main push. The weekly scan keeps security coverage.
# See docs/ci-trigger-policy.md and `npm run actions:ci-triggers`.
on:
  schedule:
    - cron: '31 3 * * 2'
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # The Android wrapper has 3 Capacitor-scaffolding Java files (MainActivity +
          # 2 example tests). Default-setup auto-enabled this language at some point —
          # keep it in the explicit matrix so scans don't get
          # "1 configuration not found" warnings when CodeQL diffs against historical state.
          - language: java-kotlin
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
