name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Angular unit tests
        run: npm run test:ci

      - name: Captain contract script tests
        run: npm run test:captain-contracts

      - name: Release detector replay tests
        run: npm run test:release-check

      - name: Release readiness report tests
        run: npm run test:release-readiness

      - name: Docs integrity script tests
        run: npm run test:docs-integrity

      - name: Docs command script tests
        run: npm run test:docs-commands

      - name: Drive sync backend tests
        run: npm run test:drive-sync-server

      - name: Dataset performance guard
        run: npm run perf:dataset -- --assert

  e2e:
    name: Cross-browser e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright (${{ matrix.browser }})
        run: node ./scripts/run-playwright-e2e.mjs --e2e-project=${{ matrix.browser }} --quarantine-mode=exclude
        env:
          CI: 'true'

      - name: Summarize Playwright failures (${{ matrix.browser }})
        if: always()
        run: |
          node ./scripts/summarize-playwright-failures.mjs \
            --input test-results \
            --output-json test-results/playwright-failure-summary-${{ matrix.browser }}.json \
            --output-md test-results/playwright-failure-summary-${{ matrix.browser }}.md \
            --append-github-step-summary

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-quarantine:
    name: Quarantined browser e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run quarantined Playwright (${{ matrix.browser }})
        run: node ./scripts/run-playwright-e2e.mjs --e2e-project=${{ matrix.browser }} --quarantine-mode=only
        env:
          CI: 'true'

      - name: Summarize quarantined Playwright failures (${{ matrix.browser }})
        if: always()
        run: |
          node ./scripts/summarize-playwright-failures.mjs \
            --input test-results \
            --output-json test-results/playwright-quarantine-failure-summary-${{ matrix.browser }}.json \
            --output-md test-results/playwright-quarantine-failure-summary-${{ matrix.browser }}.md \
            --append-github-step-summary

      - name: Upload quarantined Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-quarantine-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
