  <!--
    869f13c5m. No analytics code loads with this page. The Google Tag Manager container (and
    Microsoft Clarity, which it delivers) and GA4's gtag.js used to load here on every visit,
    before anyone was asked; they now load from GoogleAnalyticsService.enable(), which only
    runs after the reader accepts analytics. Do not add a tag back to this file.
  -->
  <meta charset="utf-8">
  <!--
    869f13285. The site served zero security headers and carried no policy at all until 2026-09-15.

    GitHub Pages cannot set response headers, so a <meta http-equiv> policy is the only mechanism
    available. Three protections are therefore genuinely unavailable on this host and are NOT
    silently missing - they cannot be expressed here at all:

      - frame-ancestors  (meta ignores it) -> no clickjacking protection
      - X-Frame-Options  (header only)
      - X-Content-Type-Options / Permissions-Policy (header only)

    'unsafe-inline' in script-src is load-bearing and not laziness: Google Tag Manager, once a
    reader accepts analytics, injects inline scripts at runtime, so a hash or nonce list cannot
    hold. (index.html itself carries two inline bootstrap scripts since 869f13c5m, down from five.) What the policy still buys is the part that matters most for a client-side app
    with no backend - an injected script cannot reach an origin that is not listed in connect-src,
    cannot set a <base>, and cannot post a form off-site.

    'wasm-unsafe-eval' is required by sql.js, which compiles the dataset engine from WASM.

    TWO script sources are injected at runtime and appear nowhere in this repository. Both were
    blocked by earlier versions of this policy, and each cost a round trip to find:

      - Microsoft Clarity (clarity.ms, c.bing.com), injected by the site's Google Tag Manager
        container. Found by `npm run security:csp`, which blocked it on all four routes - when
        the container still loaded before consent. Since 869f13c5m it loads only after a reader
        accepts, which a local serve with no GA4 id never offers, so the origin list in
        scripts/check-csp-policy.mjs is what keeps these origins asserted.
      - Cloudflare Web Analytics (static.cloudflareinsights.com, cloudflareinsights.com), injected
        by CLOUDFLARE ITSELF at the edge. `npm run security:csp` CANNOT find this one: it serves
        the build from a local HTTP server, and there is no CDN in front of that to inject
        anything. It was caught in production by the public-entry synthetics after the v0.4.43
        release, which is exactly what those synthetics are for.

    So the local check is necessary and not sufficient, and that is a property of the harness
    rather than a defect in it. `scripts/check-csp-policy.mjs` therefore asserts both families of
    origin from a list, so an edit that drops one fails without needing a browser to prove it.

    Re-run `npm run security:csp` after ANY change to the GTM container, and read the public-entry
    synthetics after any release that touches this policy.

    Every directive below is proven against a real served build by `npm run security:csp`, which
    drives the app and fails on any violation. Do not edit this policy without rerunning it, and
    do not verify it by deploying.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://www.googletagmanager.com https://www.google-analytics.com https://*.clarity.ms https://c.bing.com; connect-src 'self' data: blob: https://www.googleapis.com https://accounts.google.com https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://*.clarity.ms https://c.bing.com https://cloudflareinsights.com https://static.cloudflareinsights.com; worker-src 'self' blob:; frame-src 'self' https://www.googletagmanager.com https://accounts.google.com; manifest-src 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
  >

  <script>
    (function restoreGithubPagesRoute() {
      var searchParams = new URLSearchParams(window.location.search);
      var routePath = searchParams.get("__gh_path__");

      if (!routePath) {
        return;
      }

      var routeSearch = searchParams.get("__gh_search__");
      var routeHash = searchParams.get("__gh_hash__");
      var baseHref = document.querySelector("base")?.getAttribute("href") || "/";
      var normalizedBaseHref = baseHref.endsWith("/") ? baseHref : baseHref + "/";
      var normalizedRoutePath = routePath.replace(/^\/+/, "");
      var restoredUrl = normalizedRoutePath
        ? normalizedBaseHref + normalizedRoutePath
        : normalizedBaseHref;

      if (routeSearch) {
        restoredUrl += "?" + routeSearch;
      }

      if (routeHash) {
        restoredUrl += "#" + routeHash;
      }

      window.history.replaceState(null, "", restoredUrl);
    })();
  </script>
