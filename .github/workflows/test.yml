name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Angular unit tests
        run: npm run test:ci

      - name: Drive sync backend tests
        run: npm run test:drive-sync-server

      - name: Dataset performance guard
        run: npm run perf:dataset -- --assert
