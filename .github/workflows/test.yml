name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve brain ref
        id: brain-ref
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          ref="main"
          for candidate in "${branch%-app}" "${branch}"; do
            if git ls-remote --exit-code --heads https://github.com/JohnChourp/optc-team-builder-brain.git "${candidate}" >/dev/null 2>&1; then
              ref="${candidate}"
              break
            fi
          done
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout brain
        uses: actions/checkout@v7
        with:
          repository: JohnChourp/optc-team-builder-brain
          ref: ${{ steps.brain-ref.outputs.ref }}
          path: _linked/optc-team-builder-brain

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Docs integrity
        run: npm run docs:integrity
        env:
          OPTC_BRAIN_DIR: _linked/optc-team-builder-brain

      - name: Angular unit tests
        run: npm run test:ci

      - name: Captain contract script tests
        run: npm run test:captain-contracts

      - name: Release detector replay tests
        run: npm run test:release-check

      - name: Release readiness report tests
        run: npm run test:release-readiness

      - name: Drive sync backend tests
        run: npm run test:drive-sync-server

      - name: Dataset performance guard
        run: npm run perf:dataset -- --assert

  e2e:
    name: Cross-browser e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright (${{ matrix.browser }})
        run: node ./scripts/run-playwright-e2e.mjs --e2e-project=${{ matrix.browser }}
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
