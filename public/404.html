<!doctype html>
<html lang="en">
<head>
  <!-- 869f13c5m. No analytics tag here: this page only redirects, and nothing loads before consent. -->
  <meta charset="utf-8">
  <title>OPTC Team Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <script>
    (function redirectGithubPagesRoute() {
      var routePath = window.location.pathname || "/";
      var redirectUrl = new URL("/", window.location.origin);

      redirectUrl.searchParams.set("__gh_path__", routePath);
      redirectUrl.searchParams.set("__gh_search__", window.location.search.slice(1));
      redirectUrl.searchParams.set("__gh_hash__", window.location.hash.slice(1));

      window.location.replace(redirectUrl.toString());
    })();
  </script>
</head>
