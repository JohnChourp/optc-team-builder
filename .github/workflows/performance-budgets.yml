name: Performance Budgets

on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: Optional successful Performance Budgets run ID to compare against
        required: false
        type: string
      fail_on_regression:
        description: Fail the workflow when hard performance budgets are exceeded
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 6 * * 1-5'

permissions:
  contents: read
  actions: read

concurrency:
  group: performance-budgets
  cancel-in-progress: false

jobs:
  performance-budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 30 minutes"
            echo "- Concurrency policy: Performance evidence runs are serialized and never cancel in-progress history-producing runs."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve baseline report
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ github.event.inputs.baseline_run_id }}
        run: |
          mkdir -p perf-artifacts/baseline
          baseline_run_id="${BASELINE_RUN_ID:-}"

          if [[ -z "${baseline_run_id}" ]]; then
            baseline_run_id="$(
              gh run list \
                --workflow performance-budgets.yml \
                --branch main \
                --status success \
                --limit 20 \
                --json databaseId \
                --jq '.[0].databaseId // ""'
            )"
          fi

          if [[ -z "${baseline_run_id}" ]]; then
            echo "No previous successful Performance Budgets run found." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if gh run download "${baseline_run_id}" --name performance-budget-report --dir perf-artifacts/baseline; then
            baseline_report_path="$(find perf-artifacts/baseline -name performance-budget-report.json -type f | head -n 1)"

            if [[ -n "${baseline_report_path}" ]]; then
              echo "baseline_report_path=${baseline_report_path}" >> "${GITHUB_OUTPUT}"
              echo "Using baseline report from run ${baseline_run_id}." >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "Run ${baseline_run_id} had no performance-budget-report.json artifact." >> "${GITHUB_STEP_SUMMARY}"
            fi
          else
            echo "No downloadable baseline artifact found for run ${baseline_run_id}." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Download recent performance history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p perf-artifacts/history
          run_ids="$(
            gh run list \
              --workflow performance-budgets.yml \
              --branch main \
              --status completed \
              --limit 12 \
              --json databaseId \
              --jq '.[].databaseId'
          )"

          if [[ -z "${run_ids}" ]]; then
            echo "No previous completed Performance Budgets runs found for history." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          for run_id in ${run_ids}; do
            run_dir="perf-artifacts/history/run-${run_id}"
            mkdir -p "${run_dir}"

            if gh run download "${run_id}" --name performance-budget-report --dir "${run_dir}"; then
              echo "Downloaded performance history from run ${run_id}." >> "${GITHUB_STEP_SUMMARY}"
            else
              rm -rf "${run_dir}"
              echo "No downloadable performance report artifact found for run ${run_id}." >> "${GITHUB_STEP_SUMMARY}"
            fi
          done

      - name: Ability filter performance
        env:
          CI: 'true'
          PERF_ASSERT: '0'
          PERF_ARTIFACT_DIR: ${{ github.workspace }}/perf-artifacts/current/ability
          PERF_RUN_LABEL: ability-filter
        run: npm run perf:ability-filters

      - name: Explanation and compare performance
        env:
          CI: 'true'
          PERF_ASSERT: '0'
          PERF_ARTIFACT_DIR: ${{ github.workspace }}/perf-artifacts/current/explanation
          PERF_RUN_LABEL: explanation-compare
        run: npm run perf:explanation-compare

      - name: Saved-team codec performance
        env:
          CI: 'true'
          PERF_ASSERT: '0'
          PERF_ARTIFACT_DIR: ${{ github.workspace }}/perf-artifacts/current/saved-team-codecs
          PERF_RUN_LABEL: saved-team-codecs
        run: npm run perf:saved-team-codecs

      - name: Route-load and bundle performance
        env:
          CI: 'true'
          PERF_ASSERT: '0'
          PERF_ARTIFACT_DIR: ${{ github.workspace }}/perf-artifacts/current/route-load
          PERF_RUN_LABEL: route-load
        run: npm run perf:route-load

      - name: Build performance budget report
        id: budget_report
        env:
          BASELINE_REPORT_PATH: ${{ steps.baseline.outputs.baseline_report_path }}
          FAIL_ON_REGRESSION: ${{ github.event.inputs.fail_on_regression || 'false' }}
        run: |
          report_args=(
            --current-dir perf-artifacts/current
            --output perf-artifacts/performance-budget-report.json
            --summary perf-artifacts/performance-budget-summary.md
            --report-only
          )

          if [[ -n "${BASELINE_REPORT_PATH}" ]]; then
            report_args+=(--baseline-report "${BASELINE_REPORT_PATH}")
          fi

          npm run perf:budget-report -- "${report_args[@]}"
          cat perf-artifacts/performance-budget-summary.md >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${FAIL_ON_REGRESSION}" == "true" ]]; then
            node -e "const fs = require('node:fs'); const report = JSON.parse(fs.readFileSync('perf-artifacts/performance-budget-report.json', 'utf8')); const failures = Array.isArray(report.hardBudgetFailures) ? report.hardBudgetFailures.length : 0; if (failures > 0) { console.error('Hard performance budgets failed for ' + failures + ' metric(s).'); process.exit(1); }"
          fi

      - name: Build performance trend history
        if: always()
        run: |
          npm run perf:budget-history -- \
            --current-report perf-artifacts/performance-budget-report.json \
            --history-dir perf-artifacts/history \
            --output perf-artifacts/performance-budget-history.json \
            --summary perf-artifacts/performance-budget-history.md

          cat perf-artifacts/performance-budget-history.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Resolve performance visual evidence upload
        id: visual_evidence
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function hasPngFiles(dir) {
            if (!fs.existsSync(dir)) {
              return false;
            }

            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const entryPath = path.join(dir, entry.name);
              if (entry.isDirectory() && hasPngFiles(entryPath)) {
                return true;
              }
              if (entry.isFile() && entry.name.endsWith('.png')) {
                return true;
              }
            }

            return false;
          }

          let upload = false;
          if (fs.existsSync('perf-artifacts/performance-budget-report.json')) {
            const report = JSON.parse(fs.readFileSync('perf-artifacts/performance-budget-report.json', 'utf8'));
            const failures = Array.isArray(report.hardBudgetFailures) ? report.hardBudgetFailures.length : 0;
            const warnings = Array.isArray(report.baselineDeltaWarnings) ? report.baselineDeltaWarnings.length : 0;
            upload = failures > 0 || warnings > 0;
          } else {
            upload = hasPngFiles('perf-artifacts/current');
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `upload=${upload}\n`);
          NODE

      - name: Upload performance budget artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-budget-report
          path: |
            perf-artifacts/performance-budget-report.json
            perf-artifacts/performance-budget-summary.md
            perf-artifacts/performance-budget-history.json
            perf-artifacts/performance-budget-history.md
            perf-artifacts/current/**/*.json
          if-no-files-found: error
          retention-days: 45

      - name: Upload performance visual evidence
        if: always() && steps.visual_evidence.outputs.upload == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-budget-visual-evidence
          path: perf-artifacts/current/**/*.png
          if-no-files-found: warn
          retention-days: 14
