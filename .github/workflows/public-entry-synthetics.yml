name: Public Entry Synthetics

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public site base URL to monitor
        required: false
        default: https://optcteambuilder.com
        type: string
  schedule:
    - cron: '41 6 * * *'

permissions:
  contents: read

concurrency:
  group: public-entry-synthetics
  cancel-in-progress: false

jobs:
  public-entry-synthetics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 15 minutes"
            echo "- Concurrency policy: Public-entry evidence runs are serialized and never cancel in-progress monitor runs."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public entry synthetics
        env:
          PUBLIC_ENTRY_BASE_URL: ${{ inputs.base_url || 'https://optcteambuilder.com' }}
          PUBLIC_ENTRY_SYNTHETIC_ARTIFACT_DIR: ${{ github.workspace }}/synthetic-artifacts/public-entry
        run: npm run synthetic:public-entry

      - name: Upload public entry synthetic artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: public-entry-synthetics-report
          path: synthetic-artifacts/public-entry/
          if-no-files-found: warn
          retention-days: 30
