name: Deploy GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 25 minutes"
            echo "- Concurrency policy: GitHub Pages deploys favor the latest production artifact and cancel stale deploy attempts."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages artifact
        env:
          APP_GA4_MEASUREMENT_ID: ${{ secrets.APP_GA4_MEASUREMENT_ID }}
          APP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.APP_GOOGLE_WEB_CLIENT_ID }}
          APP_GOOGLE_IOS_CLIENT_ID: ${{ secrets.APP_GOOGLE_IOS_CLIENT_ID }}
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/optc-team-builder/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 15 minutes"
            echo "- Concurrency policy: GitHub Pages deploys favor the latest production artifact and cancel stale deploy attempts."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          error_count: 120

      - name: Dispatch public entry synthetics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run public-entry-synthetics.yml --repo "$GITHUB_REPOSITORY" --ref main -f base_url=https://optcteambuilder.com

  cache-freshness:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - name: Summarize workflow budget
        run: |
          {
            echo "### Workflow budget"
            echo "- Timeout budget: 25 minutes"
            echo "- Concurrency policy: GitHub Pages deploys favor the latest production artifact and cancel stale deploy attempts."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify PWA cache freshness
        env:
          APP_GA4_MEASUREMENT_ID: ${{ secrets.APP_GA4_MEASUREMENT_ID }}
          APP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.APP_GOOGLE_WEB_CLIENT_ID }}
          APP_GOOGLE_IOS_CLIENT_ID: ${{ secrets.APP_GOOGLE_IOS_CLIENT_ID }}
          PWA_SHELL_BUILD_SCRIPT: build:pages
          PWA_SHELL_TASK_ID: pages-cache-freshness
          PWA_SHELL_ARTIFACT_DIR: test-results/pwa-cache-freshness
        run: npm run test:pwa-shell

      - name: Upload PWA cache freshness artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pwa-cache-freshness-report
          path: test-results/pwa-cache-freshness/
          if-no-files-found: warn
          retention-days: 14
